name: Build EdgeFlash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle 8.9 oficial
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Verificar o generar Gradle Wrapper si es necesario
      run: |
        if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generando gradle wrapper..."
          gradle wrapper --gradle-version 8.9
        fi
        chmod +x gradlew

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK generado como Artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: EdgeFlash-GalaxyNote10Plus-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
